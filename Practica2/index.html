<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DummyJSON</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <h1>E-Commerce</h1>
    <p>Demostración <code>XMLHttpRequest</code></p>
  </header>

  <main class="container">
    <div id="loader" class="loader-container">
      <div class="spinner"></div>
      <p>Cargando datos vía XMLHttpRequest...</p>
    </div>

    <section id="products-grid" class="products-grid">
      <!-- Ejemplo visual provisional (tu compañero lo generará dinámicamente) -->
    </section>
  </main>

  <!-- Modal de Detalles del Producto -->
  <div id="detail-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button id="close-modal" class="close-btn" aria-label="Cerrar modal">&times;</button>
      <div class="modal-body">
        <img id="modal-img" src="" alt="Imagen del producto" class="modal-img">
        <div class="modal-info">
          <span id="modal-category" class="badge">Categoría</span>
          <h2 id="modal-title">Título del producto</h2>
          <p id="modal-description">Descripción detallada del producto...</p>
          <div class="modal-footer">
            <span id="modal-price" class="price">$0.00</span>
            <button class="btn-buy">Comprar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/script.js"></script>
</body>
</html>
